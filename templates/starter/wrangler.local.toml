# LOCAL DEVELOPMENT ONLY: `pnpm dev`. Never deploy this file.
#
# The same shared Worker, entered through packages/api/src/dev-entry.ts, which also routes the exact host
# db.localtest.me to the local database proxy (see packages/database/README.md). Put DATABASE_URL and
# API_SECRET_KEY in a git-ignored `.dev.vars` file next to this one (copy .dev.vars.example).
name = "my-recallfeed-app-local"
main = "../../packages/api/src/dev-entry.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"

[vars]
APP_NAME = "My RecallFeed app"
FEED_VISIBILITY = "public"
DEFAULT_RESURFACING_STRATEGY = "recency"
DEFAULT_CARD_TYPES = "original,highlight"
