# The RecallFeed API Worker (production entry point).
#
# This file holds non-secret defaults only. Secrets are never written here: set them with
# `wrangler secret put <NAME>`, or, for local development, in a git-ignored `.dev.vars` file.
#
#   DATABASE_URL      secret  Neon connection string. Required.
#   OWNER_EMAIL       var or secret  Private mode: the only email allowed to use the API. Required if private.
#   API_SECRET_KEY    secret  Public mode: the key writes must send in X-API-Key. Required if public.
#   SNOOZE_DEFAULT_HOURS  var  Optional. How many hours a `snoozed` review action hides a card: a whole
#                     number from 1 to 8760. Unset means 24. A value that is set but unusable (for example
#                     "abc", "0" or "1.5") makes only the `snoozed` action fail with a generic 500. It is a
#                     plain var, not a secret, so a deployment can set it under [vars] below.
#   DEFAULT_RESURFACING_STRATEGY  var  Optional. The order of GET /feed: "recency" (the default when unset
#                     or blank) or "importance". Any other value, including "due_review" (not implemented yet),
#                     makes GET /feed fail with a generic 500. Changing it invalidates cursors already handed out,
#                     which then return 400 VALIDATION_CURSOR.
#   DEFAULT_CARD_TYPES  var  Optional. The card types POST /import/markdown creates, comma-separated, e.g.
#                     "original,highlight". Unset means original only; original is always created. Known types
#                     without a generator yet (summary, reflection_prompt, code_snippet) are skipped. An unknown
#                     name makes the import fail with a generic 500 before anything is written.
#
# FEED_VISIBILITY below is the default and fails closed: anything other than the exact value "public"
# means private. A deployment chooses its mode by overriding this var, not by changing code.
name = "recallfeed-api"
main = "src/index.ts"

# Pins Workers runtime behavior. Raise it deliberately, and re-run the tests when you do.
compatibility_date = "2026-10-01"

# No Node.js compatibility layer: this Worker uses only Web APIs.

[vars]
FEED_VISIBILITY = "private"
